[project]
name = "elate"
version = "0.12.0"
description = "Emacs Lisp Automation Tool: spawn and drive sandboxed, observable Emacs sessions"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Kraus", email = "daniel@kraus.my" }]
keywords = ["emacs", "elisp", "testing", "automation", "mcp", "tmux", "ert"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: Text Editors :: Emacs",
]
dependencies = [
    "anyio>=4",
    "mcp>=1.10,<2",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://github.com/dakra/elate"
Repository = "https://github.com/dakra/elate"
Changelog = "https://github.com/dakra/elate/blob/main/CHANGELOG.md"

[project.scripts]
elate = "elate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elate"]

# Ship the Agent Skill inside the wheel so `elate install` can materialize it
# for a PyPI install that has no checkout. The canonical copy stays at the repo
# root (the Claude Code plugin/marketplace serves it from there); this is a
# build-time copy placed under the package so it resolves via `__file__` at
# runtime. Editable/dev installs don't run force-include, so paths.skill_dir
# falls back to the repo-root copy. The key is the repo-relative source; the
# value is the wheel-root (site-packages) destination under the installed
# `elate/` package.
[tool.hatch.build.targets.wheel.force-include]
"skills/elate" = "elate/_bundled/skills/elate"

# Default-deny allowlist: the sdist ships ONLY these paths. Hatchling's default
# sdist includes everything not matched by .gitignore, and it does NOT read
# .git/info/exclude -- so untracked-but-uncommitted files (.env, PLAN*/REVIEW*
# notes) would otherwise leak into the published tarball. Keep this an allowlist.
[tool.hatch.build.targets.sdist]
only-include = [
    "src/elate",
    "tests",
    "examples",
    "scripts",
    "skills",
    "agents",
    "hooks",
    ".claude-plugin",
    ".github",
    "README.md",
    "CHANGELOG.md",
    "CLAUDE.md",
    "AGENTS.md",
    "LICENSE",
    "uv.lock",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
